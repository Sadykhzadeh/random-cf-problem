name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: the scripts have to parse
        run: |
          for f in script.js modules/*.js; do
            echo "checking $f"
            node --check "$f"
          done
      - name: every script and style the page references has to exist
        run: |
          grep -oE '(src|href)="[^"#:]+"' index.html \
            | sed -E 's/.*="([^"]+)"/\1/' \
            | while read -r path; do
                test -f "$path" || { echo "missing: $path"; exit 1; }
                echo "ok: $path"
              done
